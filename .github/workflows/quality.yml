name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint scripts, styles and JSON
        run: npm run lint

      - name: Lint Markdown
        run: npm run lint:md

      # var() 引用完整性 / 断点白名单 / 颜色字面量
      - name: Check design tokens
        run: npm run check:tokens

      # frontmatter 人工字段的合法性：section / lang / category / updated
      - name: Check content contract
        run: npm run check:content

      - name: Type and Astro check
        run: npm run check

      - name: Build
        run: npm run build

      # 必须在 build 之后：检查的是构建产物里 </html> 是否为最后一个非空白内容
      - name: Check HTML structure
        run: npm run check:html
