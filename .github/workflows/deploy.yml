name: Deploy Frees Blog to GitHub Pages

# ── 部署必须排在质量之后 ──
#
# 原先这个工作流与 quality.yml **互不相干**：两者都监听 push 到 main，
# 各自跑各自的。于是「质量没过就上线」是可能的 —— 而且很容易发生：
# 一次构建失败，部署那边照样把上一个成功的产物发出去，
# 或者两边同时失败而人只看到其中一条。
#
# 现在质量检查是本工作流的一个 job，部署用 `needs:` 依赖它。
# 这不是「更严格」，是把一条原本靠人盯着的约定变成了结构：
# **检查不通过，deploy 这个 job 根本不会开始。**

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 复用 quality.yml 的整条检查链。放进 `needs:` 之后，
  # 它失败就意味着 build / deploy 都不会运行。
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build and upload Astro site
        uses: withastro/action@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
