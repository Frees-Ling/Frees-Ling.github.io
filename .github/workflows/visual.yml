name: Visual Quality

# ── 为什么这条链不跟着每次 push 跑 ──
#
# 它要跑真实浏览器（axe-core 审计 + 键盘走查 + 对比度/溢出/控制台断言）。
# 断言类的检查在 CI 上是有意义的，但代价与噪声都比 quality.yml 高：
# 浏览器版本、字体渲染、时序都可能让结果在本地与 CI 之间不一致。
#
# 所以它独立成一个工作流，**手动触发 + 每周一次**：
# 日常靠 quality.yml 拦回归，视觉与无障碍靠它定期体检。
# 出问题时可以随时手动跑一次，而不必等下一次 push。

on:
  workflow_dispatch:
    inputs:
      privacy_only:
        description: 'Run only the focused privacy dialog and no-vendor-request checks'
        type: boolean
        default: false
      prepare_format_patch:
        description: 'Prepare a formatting review artifact only; does not validate or deploy'
        type: boolean
        default: false
      production_analytics:
        description: 'Owner-authorized real SDK diagnostic on the approved public blog; no deployment or ads'
        type: boolean
        default: false
      sdk_investigation:
        description: 'Isolated real SDK comparison; all collection requests intercepted, no production visit'
        type: boolean
        default: false
  schedule:
    # 每周一 03:17 UTC。刻意避开整点 —— 整点是所有人的默认值，
    # 排队最挤的时刻。
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  format-review:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_format_patch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Prepare affected-file formatting patch for review
        run: |
          mkdir -p /tmp/format-review
          git rev-parse HEAD > /tmp/format-review/base-sha.txt
          npx --no-install prettier --write public/blog-analytics.js src/utils/blog-analytics.test.mjs scripts/visual/analytics.mjs scripts/visual/analytics-production.mjs scripts/visual/analytics-sdk-investigation.mjs scripts/visual/privacy.mjs .github/workflows/visual.yml
          git diff --binary > /tmp/format-review/format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: blog-analytics-format-review
          path: /tmp/format-review/
          retention-days: 7
          if-no-files-found: error

  sdk-investigation:
    if: ${{ inputs.sdk_investigation && !inputs.prepare_format_patch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Diagnostic only - all collection requests intercepted
        run: node scripts/visual/analytics-sdk-investigation.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
          ANALYTICS_SDK_INVESTIGATION: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-sdk-investigation
          path: test-results/analytics-sdk-investigation/**
          retention-days: 7
          if-no-files-found: error

  visual:
    if: ${{ !inputs.prepare_format_patch && !inputs.sdk_investigation }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install owner-approved Chinese fonts on the temporary runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-list :lang=zh-cn family | grep -F 'Noto Sans CJK'

      - name: Build
        run: npm run build

      - name: Privacy dialog regression
        run: node scripts/visual/privacy.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Analytics consent browser contract (isolated SDK fixture)
        run: node scripts/visual/analytics.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # 浏览器质量门禁：对比度必须为 0 失败、无控制台错误、
      # 无横向溢出、键盘不会聚焦到不可见元素、路由全部可达
      - name: Browser quality gate
        if: ${{ !inputs.privacy_only }}
        run: npm run gate
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # 无障碍审计：axe-core 扫描 + 键盘走查
      - name: Accessibility audit
        if: ${{ !inputs.privacy_only }}
        run: npm run a11y
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # 失败时把审计产物传出来 —— 否则只能看到「有 N 个问题」，
      # 而看不到是哪一条
      - name: Real production analytics SDK diagnostic
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.production_analytics }}
        run: node scripts/visual/analytics-production.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
          ANALYTICS_PRODUCTION_CHECK: 'true'

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: |
            _backups/**
            test-results/analytics/**
            test-results/analytics-production/**
            test-results/analytics-sdk-investigation/**
          retention-days: 14
          if-no-files-found: ignore
