<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>书房 · 知识库</title>
    <!-- 与公开站共用同一套设计变量，不复制一份 -->
    <link rel="stylesheet" href="/tokens.css" />
    <!-- 正文样式取自项目本身，不复制一份：预览与公开站必须长得一样 -->
    <link rel="stylesheet" href="/prose.css" />
    <link rel="stylesheet" href="/static/studio.css" />
  </head>
  <body>
    <header class="bar">
      <span class="mark">书房</span>
      <nav class="tabs" aria-label="视图">
        <button type="button" id="tab-notes" class="tab" aria-current="true">
          笔记
        </button>
        <button type="button" id="tab-chat" class="tab" aria-current="false">
          对话
        </button>
        <button type="button" id="tab-memory" class="tab" aria-current="false">
          记忆
        </button>
        <button
          type="button"
          id="tab-settings"
          class="tab"
          aria-current="false"
        >
          配置
        </button>
      </nav>
      <!-- 用语义元素 <search> 而不是给 form 加 role="search" -->
      <search class="search">
        <form id="search-form">
          <label class="sr-only" for="q">检索笔记</label>
          <input
            id="q"
            type="search"
            placeholder="检索标题与正文…"
            autocomplete="off"
          />
        </form>
      </search>
      <button type="button" id="new" class="btn primary">新建</button>
      <button type="button" id="theme" class="btn" aria-pressed="false">
        深色
      </button>
    </header>

    <main class="layout" id="view-notes">
      <nav class="list" aria-label="笔记列表">
        <ol id="notes"></ol>
        <p id="list-mode" class="list-mode" role="status"></p>
        <p id="empty" class="empty" hidden>这里还没有笔记。点「新建」开始。</p>
      </nav>

      <section class="pane" aria-live="polite">
        <div id="placeholder" class="placeholder">
          <p>从左边选一条，或者新建一条。</p>
        </div>

        <form id="editor" hidden>
          <label class="sr-only" for="title">标题</label>
          <input
            id="title"
            class="title"
            type="text"
            placeholder="标题"
            required
          />
          <label class="sr-only" for="tags">标签（逗号分隔）</label>
          <input
            id="tags"
            class="tags"
            type="text"
            placeholder="标签，用逗号分隔"
          />
          <label class="sr-only" for="body">正文</label>
          <textarea
            id="body"
            class="body"
            placeholder="用 Markdown 写…"
          ></textarea>

          <!-- 预览用的是公开站同一套渲染管线与同一份 prose.css。
               刻意**不做并排**：prose.css 的标题用 clamp(…, 4vw, …) 定尺寸，
               而 vw 跟的是视口宽度不是容器宽度 —— 半宽面板里排出来的字号
               与真正发布出去的并不一样，那种「预览」反而会误导。
               全宽切换则与实际页面在同一视口宽度下，看到的才是真的。 -->
          <div id="preview-wrap" class="preview-wrap" hidden>
            <p class="preview-note">预览 · 与发布使用同一套渲染管线与样式</p>
            <!-- 用**沙箱 iframe** 而不是把 HTML 塞进 innerHTML。
                 渲染管线按设计是透传裸 HTML 的（Astro 的 markdown 如此），
                 于是「从网页或 AI 输出里粘一段带 <script> 的内容再预览」
                 就会以**当前会话的身份**执行它 —— 这是公开站没有的提权：
                 静态站点上没有会话可偷，而 Studio 里有。

                 沙箱同时关掉脚本与同源：脚本不执行，框架也读不到父页面、
                 用不上会话。比「把危险标签过滤掉」可靠 ——
                 自己写过滤器是出了名容易漏的活，而沙箱是浏览器保证的。
                 好处是**保真度不受影响**：HTML 还是同一份，只是不执行。 -->
            <iframe
              id="preview"
              class="preview-frame"
              sandbox
              title="预览"
            ></iframe>
          </div>

          <div class="actions">
            <button type="submit" class="btn primary">保存</button>
            <button
              type="button"
              id="toggle-preview"
              class="btn"
              aria-pressed="false"
            >
              预览
            </button>
            <button type="button" id="delete" class="btn danger">删除</button>
            <span id="status" class="status" role="status"></span>
          </div>
        </form>
      </section>
    </main>

    <section class="layout chat" id="view-chat" hidden>
      <nav class="list" aria-label="对话列表">
        <div class="chat-new">
          <button type="button" id="new-conv" class="btn primary">
            新对话
          </button>
        </div>
        <ol id="conversations"></ol>
        <p id="no-conv" class="empty">还没有对话。</p>
      </nav>

      <section class="pane">
        <div class="chat-head">
          <span id="model-status" class="status" role="status"
            >正在检查模型端点…</span
          >
          <span id="model-name" class="model"></span>
        </div>

        <div id="messages" class="messages" aria-live="polite">
          <p class="placeholder">选一个对话，或者新建一个来提问。</p>
        </div>

        <form id="composer" class="composer">
          <label class="sr-only" for="prompt">提问</label>
          <textarea
            id="prompt"
            rows="2"
            placeholder="问点什么…（会在知识库里检索相关笔记作为引用）"
          ></textarea>
          <button type="submit" class="btn primary" id="send">发送</button>
        </form>
      </section>
    </section>

    <section class="layout memory" id="view-memory" hidden>
      <nav class="list" aria-label="记忆筛选">
        <div class="chat-new">
          <button
            type="button"
            id="mem-pending"
            class="btn"
            aria-current="true"
          >
            待审核
          </button>
          <button type="button" id="mem-approved" class="btn">已确认</button>
        </div>
        <p class="empty">
          待审核的记忆是 AI 从对话里提取的结论。<br />
          它们<strong>不会</strong>进入检索，直到你确认。
        </p>
      </nav>

      <section class="pane">
        <div class="chat-head">
          <span id="mem-status" class="status" role="status"></span>
        </div>
        <div id="memories" class="messages" aria-live="polite"></div>
      </section>
    </section>

    <section class="layout settings" id="view-settings" hidden>
      <nav class="list" aria-label="配置说明">
        <p class="empty">
          普通配置改完即生效，存在本地库里。<br /><br />
          敏感项<strong>不存值</strong>：这里只指定「去哪里取」。
          密码留在环境变量或钥匙串里，程序手上没有可泄漏的东西 ——
          所以也<strong>没有</strong>密码输入框。
        </p>
      </nav>

      <section class="pane">
        <div class="chat-head">
          <span id="settings-status" class="status" role="status"></span>
        </div>
        <div id="settings" class="messages"></div>
      </section>
    </section>

    <script src="/static/app.js"></script>
  </body>
</html>
